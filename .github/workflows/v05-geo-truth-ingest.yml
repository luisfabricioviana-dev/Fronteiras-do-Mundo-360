name: FDM360 v05 Geo Truth Ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v05_geo_truth_ingest.py'
      - '.github/workflows/v05-geo-truth-ingest.yml'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 geopandas shapely pyogrio fiona
      - name: Build GEO_TRUTH_REFERENCE_BUNDLE_v05
        run: python scripts/v05_geo_truth_ingest.py
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FDM360_GEO_TRUTH_REFERENCE_BUNDLE_v05
          path: artifacts/v05_geo_truth
          if-no-files-found: warn
